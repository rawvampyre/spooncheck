<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spooncheck - osrs rng check</title>
  <meta name="description" content="check how good your osrs account's rng is.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="intro" class="screen">
    <div class="intro-inner">
      <img class="spoon-mark" src="icons/Wooden_spoon.png" alt="">
      <h1>SPOONCHECK</h1>
      <p class="tag">check your accounts rng</p>
      <p class="sub">import your account or fill your grinds in yourself</p>
      <button id="start-btn">check my rng</button>
      <p class="fineprint">grinds are weighted by how much they matter to progression, and some rates lean on assumptions, so treat your result as a good estimate rather than an exact science</p>
    </div>
  </section>

  <section id="flow" class="screen hidden">
    <div id="flow-progress">
      <div id="flow-bar"></div>
      <div id="flow-step">getting started</div>
    </div>
    <div id="flow-body"></div>
  </section>

  <section id="wrap" class="screen hidden">
    <div id="story-bars"></div>
    <div id="slides"></div>
    <div id="wrap-nav">
      <button id="wrap-prev" class="nav-arrow" title="back">‹</button>
      <button id="wrap-next" class="nav-arrow" title="next">›</button>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
